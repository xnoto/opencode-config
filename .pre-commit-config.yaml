repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: \.tmpl$
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-jsonschema
        name: Validate opencode.json against the upstream OpenCode schema
        args: ["--schemafile", "https://opencode.ai/config.json"]
        files: ^opencode\.json$

  - repo: local
    hooks:
      - id: check-agent-frontmatter
        name: Validate OpenCode agent definitions
        entry: python3 scripts/check-agent-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
