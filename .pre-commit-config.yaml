repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: \.tmpl$
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: Validate OpenCode config against the upstream OpenCode schema
        additional_dependencies: [json5==0.15.0]
        args: ["--schemafile", "https://opencode.ai/config.json", "--force-filetype", "json5"]
        files: ^opencode\.jsonc?$
        types: [file]
        types_or: [file]
      - id: check-jsonschema
        name: Validate OpenCode CLI config against the upstream V2 schema
        args: ["--schemafile", "https://opencode.ai/v2/cli.json"]
        files: ^cli\.json$

  - repo: local
    hooks:
      - id: check-agent-frontmatter
        name: Validate OpenCode agent definitions
        entry: python3 scripts/check-agent-frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
      - id: check-opencode-mem-config
        name: Validate opencode-mem safe defaults
        entry: python scripts/check-opencode-mem-config.py
        language: python
        additional_dependencies: [json5==0.15.0]
        pass_filenames: false
        always_run: true
      - id: test-opencode-mem-config
        name: Test opencode-mem safe-default validation
        entry: python -B -m unittest discover -s tests -p test_opencode_mem_config.py
        language: python
        additional_dependencies: [json5==0.15.0]
        pass_filenames: false
        always_run: true
      - id: test-agent-frontmatter
        name: Test agent frontmatter and specialist roster
        entry: python -B -m unittest discover -s tests -p test_agent_frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
